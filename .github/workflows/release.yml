name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  watch:
    types: [started]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      commit: ${{ steps.package.outputs.commit }}

    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "logd") | .version' | head -n 1)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Cannot find the logd package in Cargo metadata" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            expected_tag="v$version"
            if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
              echo "Tag '$RELEASE_TAG' does not match Cargo version '$expected_tag'" >&2
              exit 1
            fi
          else
            RELEASE_TAG="v$version"
            echo "Event '$GITHUB_EVENT_NAME' will publish release '$RELEASE_TAG'."
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package-windows:
    name: Package Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build executable and MSI
        run: cargo packager --release -p logd --formats wix

      - name: Verify Windows GUI executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/logd.exe).Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "logd.exe uses PE subsystem $subsystem; expected WINDOWS_GUI (2)"
          }

      - name: Collect Windows packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path target/release -Filter *.msi -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected one MSI package, found $($packages.Count)"
          }

          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item target/release/logd.exe release-assets/logd.exe
          Copy-Item $packages[0].FullName "release-assets/logd-$env:RELEASE_VERSION-windows-x86_64.msi"
          $target = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          Compress-Archive -LiteralPath target/release/logd.exe -DestinationPath "release-assets/logd-$target.zip"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  package-macos:
    name: Package macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Generate macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          iconset="target/logd.iconset"
          mkdir -p "$iconset"

          sips -z 16 16 public/2.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 public/2.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 public/2.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 public/2.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 public/2.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 public/2.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 public/2.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 public/2.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 public/2.png --out "$iconset/icon_512x512.png"
          sips -z 1024 1024 public/2.png --out "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o public/logd.icns

      - name: Build DMG
        run: cargo packager --release -p logd --formats dmg

      - name: Verify macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          package="$(find target/release -type f -name '*.dmg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Cannot find the packaged DMG" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$package" -readonly -nobrowse -mountpoint "$mount_dir" -quiet

          app="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "DMG does not contain a macOS .app bundle" >&2
            exit 1
          fi
          bundle_type="$(plutil -extract CFBundlePackageType raw "$app/Contents/Info.plist")"
          if [[ "$bundle_type" != "APPL" ]]; then
            echo "Unexpected macOS bundle type '$bundle_type'; expected APPL" >&2
            exit 1
          fi

      - name: Collect macOS package
        shell: bash
        run: |
          set -euo pipefail
          package_count="$(find target/release -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$package_count" -ne 1 ]]; then
            echo "Expected one DMG package, found $package_count" >&2
            exit 1
          fi

          package="$(find target/release -type f -name '*.dmg' -print -quit)"
          arch="$(uname -m)"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p release-assets
          cp "$package" "release-assets/logd-${RELEASE_VERSION}-macos-${arch}.dmg"
          cp target/release/logd release-assets/logd
          chmod +x release-assets/logd
          (cd release-assets && zip "logd-${target}.zip" logd)
          rm release-assets/logd

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - version
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.value }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(release-assets/*)
          if [[ ${#assets[@]} -ne 5 ]]; then
            echo "Expected five release files, found ${#assets[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease=false \
              --title "logd $RELEASE_VERSION"
          else
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$RELEASE_COMMIT" \
              --generate-notes \
              --draft=false \
              --prerelease=false \
              --title "logd $RELEASE_VERSION"
          fi
