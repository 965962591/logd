[workspace]
resolver = "2"
members = ["crates/logd-core", "crates/logd"]

[workspace.package]
version = "0.1.18"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.18"
memchr = "2.8.0"
memmap2 = "0.9.11"
aho-corasick = "1.1.4"
regex = "1.12.3"
rayon = "1.12.0"
quick-xml = "0.36.2"
encoding_rs = "0.8.35"
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
twox-hash = "2.1.3"
dirs = "7.0.0"
serde_json = "1.0.149"
serde = { version = "1.0.229", features = ["derive"] }
semver = "1.0.27"
ureq = "3.4.1"
kaishin = "0.7.1"
tokio = { version = "1.53.1", features = ["io-util", "process", "rt", "sync", "time"] }
# zed 这两条必须用**原始 github 地址**，不能走 gh-proxy 镜像：
# gpui-component 自己的 manifest 里写死的是 https://github.com/zed-industries/zed，
# cargo 按 URL 字符串区分 source，地址不一致就会拉进两份 gpui，
# 编出来的 WindowOptions / Render 等类型互不兼容（E0308 "multiple different versions of crate gpui"）。
# gpui-component 本身没人跟它抢，可以继续走镜像。
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://gh-proxy.org/https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://gh-proxy.org/https://github.com/longbridge/gpui-component" }
anyhow = "1.0.102"
# 大文件扫描全靠 release 下的向量化 memchr/aho-corasick，dev 模式跑 50GB 会慢到没法用。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
incremental = false
[build]
jobs = 8  # 设置为你的 CPU 核心数或稍低的值
