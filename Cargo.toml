[workspace]
resolver = "2"
members = ["crates/logd-core", "crates/logd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
memchr = "2.8.0"
memmap2 = "0.9.11"
aho-corasick = "1.1.4"
regex = "1.12.3"
rayon = "1.12.0"
quick-xml = "0.36.2"
encoding_rs = "0.8.35"
parking_lot = "0.12.5"
twox-hash = "2.1.3"
dirs = "6.0.0"

# 大文件扫描全靠 release 下的向量化 memchr/aho-corasick，dev 模式跑 50GB 会慢到没法用。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
